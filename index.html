<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>limebox</title>
<meta name="color-scheme" content="dark light">
<style>
  :root { --bg: #f7f9f2; --fg: #1d2416; --accent: #6fae1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11160c; --fg: #e8f0dc; --accent: #a4e04a; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 18px/1.5 system-ui, sans-serif; padding: 0 16px; }
  h1 { font-size: clamp(48px, 12vw, 112px); margin: 0; letter-spacing: -0.04em; }
  h1 span { color: var(--accent); }
  p { margin: 8px 0 0; opacity: .7; text-align: center; }
</style>
</head>
<body>
<main>
  <h1><span>lime</span>box</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
